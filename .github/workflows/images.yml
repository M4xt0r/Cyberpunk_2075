name: Importer des images Notion

# Envoi sur la branche images-import d'un fichier outils/images-lot.json
# ({ "chemin": "lien signé temporaire" }) : télécharge, convertit en WebP,
# ajoute les images sur main, puis supprime la branche.
on:
  push:
    branches:
      - 'images-import-*'

permissions:
  contents: write

concurrency:
  group: images
  cancel-in-progress: false

jobs:
  importer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          path: lot
      - uses: actions/checkout@v4
        with:
          ref: main
          path: depot
      - name: Télécharger et convertir
        run: |
          pip install --quiet pillow
          cd depot
          python3 - <<'PY'
          import json, os, urllib.request, io
          from PIL import Image
          lot = json.load(open("../lot/outils/images-lot.json"))
          ok = 0
          for chemin, info in lot.items():
              lien, largeur = (info, 512) if isinstance(info, str) else (info["url"], info.get("largeur", 512))
              try:
                  donnees = urllib.request.urlopen(lien, timeout=60).read()
                  img = Image.open(io.BytesIO(donnees)); img.seek(0)
                  img = img.convert("RGBA")
                  if img.width > largeur:
                      img = img.resize((largeur, round(img.height * largeur / img.width)), Image.LANCZOS)
                  os.makedirs(os.path.dirname(chemin), exist_ok=True)
                  img.save(chemin, "WEBP", quality=85)
                  ok += 1
                  print("ok", chemin)
              except Exception as e:
                  print("ECHEC", chemin, type(e).__name__, e)
          print(f"{ok}/{len(lot)} images")
          PY
      - name: Enregistrer sur main et supprimer la branche
        run: |
          cd depot
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if ! git diff --cached --quiet; then
            git commit -m "Images Notion importées"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
          git push origin --delete "${{ github.ref_name }}" || true
