name: Publier une version

# Se déclenche à chaque envoi sur main. Si la version de system.json n'a pas encore
# de publication, crée l'étiquette vX.Y.Z et la publication avec system.json et
# cyberpunk2075.zip, que Foundry télécharge via le lien de manifeste.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lire la version
        id: version
        run: |
          VERSION="$(jq -r .version system.json)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "existe=oui" >> "$GITHUB_OUTPUT"
            echo "La version v$VERSION est déjà publiée : rien à faire."
          else
            echo "existe=non" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Mettre le lien de téléchargement dans system.json
        if: steps.version.outputs.existe == 'non'
        run: |
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${{ steps.version.outputs.version }}/cyberpunk2075.zip"
          jq --arg d "$URL" '.download = $d' system.json > system.tmp
          mv system.tmp system.json

      - name: Créer l'archive
        if: steps.version.outputs.existe == 'non'
        run: zip -r cyberpunk2075.zip system.json module templates styles lang assets README.md

      - name: Publier
        if: steps.version.outputs.existe == 'non'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Cyberpunk 2075 v${{ steps.version.outputs.version }}
          make_latest: true
          files: |
            system.json
            cyberpunk2075.zip
